<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bot do Sistema - Login Admin | Luiz Fernando</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background: linear-gradient(135deg, #0f172a, #1e293b); color: #f8fafc; min-height: 100vh; display: flex; justify-content: center; align-items: center; padding: 20px; }
        .card { background: rgba(30, 41, 59, 0.95); border: 1px solid rgba(255, 255, 255, 0.1); padding: 40px; border-radius: 16px; box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5); max-width: 420px; width: 100%; text-align: center; backdrop-filter: blur(10px); }
        .logo { font-size: 48px; margin-bottom: 15px; }
        h1 { font-size: 26px; color: #38bdf8; margin-bottom: 5px; }
        h3 { font-size: 14px; color: #94a3b8; font-weight: 400; margin-bottom: 25px; }
        .form-group { margin-bottom: 15px; text-align: left; }
        label { display: block; font-size: 13px; color: #cbd5e1; margin-bottom: 5px; font-weight: 600; }
        input { width: 100%; padding: 12px 14px; background: #0f172a; border: 1px solid #334155; border-radius: 8px; color: white; font-size: 14px; }
        input:focus { outline: none; border-color: #38bdf8; }
        .btn { background: #25d366; color: white; border: none; padding: 12px 20px; border-radius: 8px; font-weight: 600; cursor: pointer; transition: background 0.3s, transform 0.2s; width: 100%; font-size: 15px; margin-top: 10px; box-shadow: 0 4px 15px rgba(37, 211, 102, 0.3); }
        .btn:hover { background: #20ba5a; transform: translateY(-2px); }
        .login-error { color: #f87171; font-size: 13px; margin-top: 10px; display: none; }
        .footer { margin-top: 25px; font-size: 12px; color: #64748b; }
    </style>
</head>
<body>
    <div class="card">
        <div class="logo">🤖</div>
        <h1>Bot do Sistema</h1>
        <h3>Painel de Acesso Restrito • Luiz Fernando</h3>
        
        <form onsubmit="fazerLogin(event)">
            <div class="form-group">
                <label>Usuário Admin</label>
                <input type="text" id="userInput" placeholder="admin" required>
            </div>
            <div class="form-group">
                <label>Senha de Acesso</label>
                <input type="password" id="passInput" placeholder="••••••" required>
            </div>
            <button type="submit" class="btn">Entrar no Painel</button>
            <div id="loginError" class="login-error">Usuário ou senha incorretos!</div>
        </form>

        <div class="footer">
            Bot do Sistema &bull; Todos os direitos reservados
        </div>
    </div>

    <script>
        function fazerLogin(event) {
            event.preventDefault();
            const user = document.getElementById('userInput').value;
            const pass = document.getElementById('passInput').value;

            if (user === 'admin' && pass === 'luiz29') {
                window.location.href = '/config';
            } else {
                document.getElementById('loginError').style.display = 'block';
            }
        }
    </script>
</body>
</html>
