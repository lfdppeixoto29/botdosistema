<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel V2.0 - Bot do Sistema</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background: #0f172a; color: #f8fafc; height: 100vh; display: flex; overflow: hidden; }
        .sidebar { width: 350px; background: #1e293b; border-right: 1px solid rgba(255,255,255,0.1); display: flex; flex-direction: column; padding: 20px; }
        .main-content { flex: 1; background: #0f172a; overflow-y: auto; padding: 40px; }
        .logo-area { display: flex; align-items: center; gap: 10px; margin-bottom: 25px; border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 15px; }
        .logo-area h2 { color: #38bdf8; font-size: 20px; }
        .menu-item { background: #0f172a; border: 1px solid #334155; border-radius: 10px; padding: 15px; margin-bottom: 10px; cursor: pointer; transition: 0.2s; }
        .menu-item:hover { border-color: #38bdf8; }
        .menu-item.active { border-color: #38bdf8; background: rgba(56, 189, 248, 0.1); }
        .menu-item h4 { font-size: 14px; margin-bottom: 5px; }
        .menu-item p { font-size: 11px; color: #94a3b8; }
        .btn { background: #25d366; color: white; border: none; padding: 12px; border-radius: 8px; font-weight: 600; cursor: pointer; width: 100%; font-size: 14px; }
        .btn-save { background: #38bdf8; color: #0f172a; margin-top: 15px; }
        .container { max-width: 800px; margin: 0 auto; background: #1e293b; border-radius: 16px; padding: 30px; border: 1px solid rgba(255,255,255,0.1); }
        .section { background: rgba(15, 23, 42, 0.4); padding: 20px; border-radius: 10px; margin-bottom: 20px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; font-size: 12px; color: #94a3b8; margin-bottom: 5px; font-weight: 600; text-transform: uppercase; }
        input, textarea, select { width: 100%; padding: 12px; background: #0f172a; border: 1px solid #334155; border-radius: 8px; color: white; font-size: 14px; }
        .sub-req-box { background: #162032; padding: 15px; border-radius: 8px; margin-bottom: 10px; border: 1px solid #334155; }
        .status-badge { font-size: 11px; padding: 3px 8px; border-radius: 10px; font-weight: 700; margin-left: 5px; }
        .status-on { background: #22c55e; color: white; }
        .status-off { background: #ef4444; color: white; }
    </style>
</head>
<body>

    <div class="sidebar">
        <div class="logo-area">
            <h2>🤖 Painel V2.0 <span style="font-size: 10px; opacity: 0.6;">(LIVE)</span></h2>
        </div>
        
        <div id="instancesList">
            <!-- Preenchido via JS -->
        </div>

        <div style="margin-top: auto;">
            <button class="btn" onclick="salvarTudo()" style="margin-bottom: 10px;">💾 Salvar Configurações</button>
            <button class="btn" style="background: transparent; border: 1px solid #ef4444; color: #ef4444;" onclick="location.href='/'">🚪 Sair</button>
        </div>
    </div>

    <div class="main-content">
        <div id="editorArea">
            <div style="text-align: center; color: #64748b; margin-top: 100px;">
                <h3>👈 Selecione um celular para configurar</h3>
            </div>
        </div>
    </div>

    <script>
        let allData = {};
        let activeInst = '';

        async function carregar() {
            const res = await fetch('/api/admin/data?t=' + Date.now());
            allData = await res.json();
            renderSidebar();
        }

        function renderSidebar() {
            const list = document.getElementById('instancesList');
            list.innerHTML = '';
            Object.keys(allData.instancesConfigs).forEach(name => {
                const status = allData.statuses[name] || 'Desconectado';
                const div = document.createElement('div');
                div.className = `menu-item ${activeInst === name ? 'active' : ''}`;
                div.onclick = () => selectInstance(name);
                div.innerHTML = `
                    <h4>📱 ${name.toUpperCase()}</h4>
                    <p>Status: <span class="status-badge ${status === 'Conectado' ? 'status-on' : 'status-off'}">${status}</span></p>
                `;
                list.appendChild(div);
            });
        }

        function selectInstance(name) {
            activeInst = name;
            renderSidebar();
            renderEditor();
        }

        function renderEditor() {
            const cfg = allData.instancesConfigs[activeInst];
            const area = document.getElementById('editorArea');
            
            let menuHtml = '';
            cfg.menuOptions.forEach((opt, idx) => {
                let subHtml = '';
                (opt.subRequests || []).forEach((sub, sIdx) => {
                    subHtml += `
                        <div class="sub-req-box">
                            <label>Nome da Solicitação ${sIdx+1}</label>
                            <input type="text" value="${sub.title}" onchange="updateSub(${idx}, ${sIdx}, this.value)">
                        </div>
                    `;
                });

                menuHtml += `
                    <div class="section">
                        <h3>🔹 Opção ${opt.id}: ${opt.title}</h3>
                        <div class="form-group">
                            <label>Título da Opção</label>
                            <input type="text" value="${opt.title}" onchange="allData.instancesConfigs['${activeInst}'].menuOptions[${idx}].title = this.value">
                        </div>
                        <div id="subArea-${idx}">
                            <label>Tipos de Solicitações (Submenus)</label>
                            ${subHtml}
                            <button class="btn" style="background: rgba(56, 189, 248, 0.2); color: #38bdf8; margin-top: 5px;" onclick="addSub(${idx})">+ Adicionar Solicitação</button>
                        </div>
                        <button class="btn" style="background: rgba(239, 68, 68, 0.1); color: #f87171; margin-top: 10px; width: auto; font-size: 11px; padding: 5px 10px;" onclick="removeOpt(${idx})">Remover Opção ${opt.id}</button>
                    </div>
                `;
            });

            area.innerHTML = `
                <div class="container">
                    <h1>Configurar: ${activeInst.toUpperCase()}</h1>
                    <p style="color: #94a3b8; margin-bottom: 20px;">Edite o nome, horário de almoço e menus deste WhatsApp.</p>

                    <div class="section">
                        <div class="form-group">
                            <label>Nome do Atendente</label>
                            <input type="text" value="${cfg.botName}" onchange="allData.instancesConfigs['${activeInst}'].botName = this.value">
                        </div>
                        <div class="form-group">
                            <label>Horário de Almoço (12h-13h)</label>
                            <select onchange="allData.instancesConfigs['${activeInst}'].lunchActive = (this.value === 'true')">
                                <option value="true" ${cfg.lunchActive ? 'selected' : ''}>Ativado</option>
                                <option value="false" ${!cfg.lunchActive ? 'selected' : ''}>Desativado</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label>Mensagem de Almoço</label>
                            <textarea onchange="allData.instancesConfigs['${activeInst}'].lunchMsg = this.value">${cfg.lunchMsg}</textarea>
                        </div>
                    </div>

                    <div id="menuOptionsArea">
                        ${menuHtml}
                    </div>
                    
                    <button class="btn" style="background: #38bdf8; color: #0f172a; margin-bottom: 15px;" onclick="addOpt()">+ Adicionar Nova Opção Principal</button>
                    <button class="btn" style="background: #25d366; color: white;" onclick="salvarTudo()">💾 Salvar Configurações</button>
                </div>
            `;
        }

        function updateSub(optIdx, subIdx, val) {
            allData.instancesConfigs[activeInst].menuOptions[optIdx].subRequests[subIdx].title = val;
        }

        function addSub(optIdx) {
            if(!allData.instancesConfigs[activeInst].menuOptions[optIdx].subRequests) allData.instancesConfigs[activeInst].menuOptions[optIdx].subRequests = [];
            allData.instancesConfigs[activeInst].menuOptions[optIdx].subRequests.push({ title: "Nova Solicitação" });
            renderEditor();
        }

        function addOpt() {
            const nextId = (allData.instancesConfigs[activeInst].menuOptions.length + 1).toString();
            allData.instancesConfigs[activeInst].menuOptions.push({ id: nextId, title: "Nova Opção", subRequests: [] });
            renderEditor();
        }

        function removeOpt(idx) {
            allData.instancesConfigs[activeInst].menuOptions.splice(idx, 1);
            renderEditor();
        }

        async function salvarTudo() {
            const cfg = allData.instancesConfigs[activeInst];
            const res = await fetch('/api/admin/config', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    instanceName: activeInst,
                    botName: cfg.botName,
                    lunchActive: cfg.lunchActive,
                    lunchMsg: cfg.lunchMsg,
                    menuOptions: cfg.menuOptions
                })
            });
            const data = await res.json();
            if(data.success) {
                alert("✅ Configurações salvas e aplicadas na nuvem!");
                carregar();
            }
        }

        carregar();
    </script>
</body>
</html>
