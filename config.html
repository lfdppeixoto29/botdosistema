<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel de Instâncias - Bot do Sistema</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background: #0f172a; color: #f8fafc; min-height: 100vh; padding: 40px 20px; }
        .container { max-width: 900px; margin: 0 auto; }
        h1 { color: #38bdf8; margin-bottom: 5px; font-size: 28px; }
        p.subtitle { color: #94a3b8; margin-bottom: 30px; font-size: 15px; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 20px; margin-bottom: 30px; }
        .card { background: #1e293b; border-radius: 16px; padding: 25px; border: 1px solid rgba(255,255,255,0.1); box-shadow: 0 10px 25px rgba(0,0,0,0.4); display: flex; flex-direction: column; justify-content: space-between; }
        .card h3 { color: #f1f5f9; font-size: 20px; margin-bottom: 10px; display: flex; align-items: center; gap: 8px; }
        .status { font-size: 14px; margin-bottom: 20px; font-weight: 600; }
        .status.conectado { color: #4ade80; }
        .status.desconectado { color: #f87171; }
        .status.aguardando { color: #facc15; }
        .btn { background: #38bdf8; color: #0f172a; border: none; padding: 10px 15px; border-radius: 8px; font-weight: 600; cursor: pointer; text-align: center; text-decoration: none; display: block; transition: background 0.3s; margin-top: 8px; }
        .btn:hover { background: #0ea5e9; color: white; }
        .btn-green { background: #25d366; color: white; }
        .btn-green:hover { background: #20ba5a; }
        .section { background: #1e293b; padding: 25px; border-radius: 16px; border: 1px solid rgba(255,255,255,0.1); }
        .form-group { margin-bottom: 15px; }
        label { display: block; font-size: 13px; color: #cbd5e1; margin-bottom: 5px; font-weight: 600; }
        input { width: 100%; padding: 12px 14px; background: #0f172a; border: 1px solid #334155; border-radius: 8px; color: white; font-size: 14px; }
        input:focus { outline: none; border-color: #38bdf8; }
        .links { margin-top: 20px; text-align: center; }
        .links a { color: #38bdf8; text-decoration: none; }
        .links a:hover { text-decoration: underline; }
    </style>
</head>
<body>
    <div class="container">
        <h1>📱 Gerenciador de Celulares (Multi-Zaps)</h1>
        <p class="subtitle">Escolha qual celular deseja configurar ou adicione um novo número abaixo.</p>

        <div class="grid" id="instancesGrid">
            <!-- Preenchido via JS -->
        </div>

        <div class="section">
            <h3 style="color: #38bdf8; margin-bottom: 15px;">➕ Adicionar Novo Celular / WhatsApp</h3>
            <div class="form-group">
                <label>Nome ou Apelido (ex: suporte, vendas, atendimento2)</label>
                <input type="text" id="newInstanceName" placeholder="ex: vendas">
            </div>
            <button class="btn btn-green" onclick="adicionarZap()" style="width: 100%; padding: 12px; font-size: 15px;">Criar e Gerar QR Code</button>
        </div>

        <div class="links">
            <a href="/">&larr; Sair do Painel Admin</a>
        </div>
    </div>

    <script>
        function carregarInstancias() {
            fetch('/api/admin/data')
                .then(res => res.json())
                .then(data => {
                    const grid = document.getElementById('instancesGrid');
                    grid.innerHTML = '';

                    const configs = data.instancesConfigs;
                    const statuses = data.statuses;

                    Object.keys(configs).forEach(name => {
                        const status = statuses[name] || 'Desconectado';
                        let statusClass = 'desconectado';
                        if (status === 'Conectado') statusClass = 'conectado';
                        else if (status.includes('Aguardando')) statusClass = 'aguardando';

                        grid.innerHTML += `
                            <div class="card">
                                <div>
                                    <h3>📱 ${name.toUpperCase()}</h3>
                                    <p class="status ${statusClass}">Status: ${status}</p>
                                    <p style="font-size: 13px; color: #94a3b8; margin-bottom: 15px;">Atendente: ${configs[name].botName || 'Luiz Fernando'}</p>
                                </div>
                                <div>
                                    <a href="/config/${name}" class="btn">⚙️ Configurar Opções</a>
                                    <a href="/qr/${name}" class="btn btn-green" target="_blank">📷 Ver QR Code</a>
                                </div>
                            </div>
                        `;
                    });
                });
        }

        function adicionarZap() {
            const name = document.getElementById('newInstanceName').value.trim();
            if (!name) {
                alert('Digite um nome para a nova instância!');
                return;
            }

            fetch('/api/instances', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ instanceName: name })
            })
            .then(res => res.json())
            .then(data => {
                if (data.success) {
                    window.location.href = `/config/${data.name}`;
                } else {
                    alert('Erro ao criar instância.');
                }
            });
        }

        carregarInstancias();
        setInterval(carregarInstancias, 5000);
    </script>
</body>
</html>
